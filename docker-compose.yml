version: '3.8'

services:
  # Container 1: The Core Database Engine
  sqlserver:
    build: . # 🛠️ Builds your local Dockerfile automatically!
    container_name: mssql_database
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Master_SA_Password123!"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql

  # Container 2: Web-Based T-SQL Query Editor via DbGate
  query-editor:
    image: dbgate/dbgate:latest
    container_name: mssql_visual_editor
    ports:
      - "8080:3000" # 🌐 Students access DbGate at http://localhost:8080
    environment:
      - CONNECTIONS=sqlserver_default
      - LABEL_sqlserver_default=Local SQL Server
      - SERVER_sqlserver_default=sqlserver
      - USER_sqlserver_default=sa
      - PASSWORD_sqlserver_default=Master_SA_Password123!
      
      # 👇 CRITICAL FIX: The explicit plugin identifier string DbGate demands
      - ENGINE_sqlserver_default=mssql@dbgate-plugin-mssql
    depends_on:
      - sqlserver

volumes:
  mssql_data: